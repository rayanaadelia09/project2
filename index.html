<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Don't Look Down - Fish Edition!</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background: linear-gradient(135deg, #1d2b64, #f8cdda);
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
      color: #fff;
    }
    #game-container {
      position: relative;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
      border-radius: 16px;
      overflow: hidden;
    }
    canvas {
      background: linear-gradient(to bottom, #87CEEB, #1E90FF);
      display: block;
    }
    #ui {
      position: absolute;
      top: 15px;
      left: 15px;
      font-size: 20px;
      font-weight: bold;
      text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
      pointer-events: none;
    }
    #game-over-screen {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.75);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
    }
    #game-over-screen.active {
      opacity: 1;
      pointer-events: auto;
    }
    h1 {
      font-size: 36px;
      color: #ff4757;
      margin-bottom: 10px;
      text-shadow: 2px 2px 0px #fff;
    }
    p {
      font-size: 18px;
      margin-bottom: 20px;
    }
    button {
      padding: 12px 28px;
      font-size: 18px;
      font-weight: bold;
      background: #2ed573;
      color: white;
      border: none;
      border-radius: 25px;
      cursor: pointer;
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
      transition: transform 0.1s, background 0.2s;
    }
    button:hover {
      background: #26af5f;
      transform: scale(1.05);
    }
    .controls-hint {
      margin-top: 10px;
      font-size: 14px;
      color: #f1f2f6;
    }
  </style>
</head>
<body>

  <div id="game-container">
    <canvas id="gameCanvas" width="400" height="600"></canvas>
    <div id="ui">Skor: <span id="score">0</span></div>
    
    <div id="game-over-screen">
      <h1>JANGAN LOOK DOWN! 🐟</h1>
      <p>Kamu Jatuh Ke Bawah! Skor: <span id="final-score">0</span></p>
      <button onclick="resetGame()">Main Lagi</button>
      <div class="controls-hint">Gunakan tombol Panah / A & D untuk bergerak</div>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const scoreEl = document.getElementById('score');
    const finalScoreEl = document.getElementById('final-score');
    const gameOverScreen = document.getElementById('game-over-screen');

    // Game variables
    let score = 0;
    let cameraY = 0;
    let scrollSpeed = 1.2;
    let isGameOver = false;

    // Controls
    const keys = { left: false, right: false };

    window.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowLeft' || e.key.toLowerCase() === 'a') keys.left = true;
      if (e.key === 'ArrowRight' || e.key.toLowerCase() === 'd') keys.right = true;
    });

    window.addEventListener('keyup', (e) => {
      if (e.key === 'ArrowLeft' || e.key.toLowerCase() === 'a') keys.left = false;
      if (e.key === 'ArrowRight' || e.key.toLowerCase() === 'd') keys.right = false;
    });

    // Player (Ikan)
    const player = {
      x: 200,
      y: 450,
      width: 36,
      height: 30,
      vx: 0,
      vy: 0,
      speed: 5,
      jumpForce: -11,
      facing: 'right',
      isScared: false
    };

    // World Elements
    let platforms = [];
    let items = [];

    function initPlatforms() {
      platforms = [];
      items = [];
      
      // Platform dasar
      platforms.push({ x: 150, y: 550, width: 100, height: 18 });

      // Generate platform ke atas
      for (let y = 480; y > -5000; y -= 65) {
        let x = Math.random() * (canvas.width - 90);
        platforms.push({ x: x, y: y, width: 85, height: 18 });

        // Peluang spawning item
        let rand = Math.random();
        if (rand < 0.25) {
          items.push({ x: x + 35, y: y - 25, type: 'star', collected: false });
        } else if (rand < 0.35) {
          items.push({ x: x + 35, y: y - 25, type: 'clover', collected: false });
        }
      }
    }

    // Draw Fish (Player)
    function drawPlayer() {
      ctx.save();
      ctx.translate(player.x, player.y - cameraY);

      if (player.facing === 'left') {
        ctx.scale(-1, 1);
      }

      // Badan Ikan (Oranye Pucat & Cute)
      ctx.fillStyle = '#ff7f50';
      ctx.beginPath();
      ctx.ellipse(0, 0, player.width / 2, player.height / 2, 0, 0, Math.PI * 2);
      ctx.fill();

      // Ekor Ikan
      ctx.fillStyle = '#ff4757';
      ctx.beginPath();
      ctx.moveTo(-player.width / 2, 0);
      ctx.lineTo(-player.width / 2 - 12, -10);
      ctx.lineTo(-player.width / 2 - 12, 10);
      ctx.closePath();
      ctx.fill();

      // Mata Besar Lucu
      ctx.fillStyle = '#ffffff';
      ctx.beginPath();
      ctx.arc(6, -4, 7, 0, Math.PI * 2);
      ctx.fill();

      // Pupil Mata (Mengecil kalau kaget saat jatuh)
      ctx.fillStyle = '#000000';
      ctx.beginPath();
      let pupilRadius = player.isScared ? 1.5 : 3.5;
      ctx.arc(player.isScared ? 7 : 8, -4, pupilRadius, 0, Math.PI * 2);
      ctx.fill();

      // Sirip Atas
      ctx.fillStyle = '#ffa502';
      ctx.beginPath();
      ctx.moveTo(-4, -player.height / 2);
      ctx.quadraticCurveTo(2, -player.height / 2 - 8, 8, -player.height / 2);
      ctx.fill();

      ctx.restore();
    }

    // Draw Clover Platform
    function drawPlatform(plat) {
      let screenY = plat.y - cameraY;
      ctx.save();
      ctx.translate(plat.x + plat.width / 2, screenY);

      // Batang / Batas Platform
      ctx.fillStyle = '#2ed573';
      ctx.beginPath();
      ctx.roundRect(-plat.width / 2, -plat.height / 2, plat.width, plat.height, 8);
      ctx.fill();

      // Hiasan Daun Clover Kecil di Platform
      ctx.fillStyle = '#26af5f';
      for (let i = -plat.width / 2 + 10; i < plat.width / 2; i += 20) {
        ctx.beginPath();
        ctx.arc(i, -plat.height / 2, 5, 0, Math.PI * 2);
        ctx.fill();
      }

      ctx.restore();
    }

    // Draw Items (Star & Super Clover)
    function drawItems(item) {
      if (item.collected) return;
      let screenY = item.y - cameraY;

      ctx.save();
      ctx.translate(item.x, screenY);

      if (item.type === 'star') {
        // Draw Bintang Bersinar
        ctx.fillStyle = '#ffd32a';
        ctx.beginPath();
        for (let i = 0; i < 5; i++) {
          ctx.lineTo(Math.cos((18 + i * 72) * Math.PI / 180) * 10,
                     -Math.sin((18 + i * 72) * Math.PI / 180) * 10);
          ctx.lineTo(Math.cos((54 + i * 72) * Math.PI / 180) * 4,
                     -Math.sin((54 + i * 72) * Math.PI / 180) * 4);
        }
        ctx.closePath();
        ctx.fill();
      } else if (item.type === 'clover') {
        // Draw Golden 4-Leaf Clover
        ctx.fillStyle = '#05c46b';
        for (let a = 0; a < 4; a++) {
          ctx.rotate(Math.PI / 2);
          ctx.beginPath();
          ctx.arc(0, -6, 5, 0, Math.PI * 2);
          ctx.fill();
        }
      }

      ctx.restore();
    }

    function update() {
      if (isGameOver) return;

      // Kamera terus naik secara berkala (Gimkit Don't Look Down Mechanic)
      cameraY -= scrollSpeed;
      scrollSpeed += 0.0002; // Percepat bertahap

      // Horizontal movement
      if (keys.left) {
        player.vx = -player.speed;
        player.facing = 'left';
      } else if (keys.right) {
        player.vx = player.speed;
        player.facing = 'right';
      } else {
        player.vx *= 0.8;
      }

      player.x += player.vx;

      // Wrap around tepi layar
      if (player.x < 0) player.x = canvas.width;
      if (player.x > canvas.width) player.x = 0;

      // Gravity & Vertical Movement
      player.vy += 0.45; // Gravitasi
      player.y += player.vy;

      // Cek apakah ikan mendekati batas bawah (Ekspresi Kaget)
      if (player.y - cameraY > canvas.height - 120 && player.vy > 0) {
        player.isScared = true;
      } else {
        player.isScared = false;
      }

      // Deteksi Jatuh (Game Over)
      if (player.y - cameraY > canvas.height + 40) {
        endGame();
      }

      // Tabrakan dengan Platform (Hanya saat jatuh ke bawah)
      if (player.vy > 0) {
        platforms.forEach(plat => {
          if (
            player.x + player.width / 2 > plat.x &&
            player.x - player.width / 2 < plat.x + plat.width &&
            player.y + player.height / 2 >= plat.y - plat.height / 2 &&
            player.y + player.height / 2 <= plat.y + plat.height / 2
          ) {
            player.vy = player.jumpForce; // Otomatis lompat
          }
        });
      }

      // Ambil Item
      items.forEach(item => {
        if (!item.collected) {
          let dist = Math.hypot(player.x - item.x, player.y - item.y);
          if (dist < 25) {
            item.collected = true;
            if (item.type === 'star') {
              score += 50;
            } else if (item.type === 'clover') {
              player.vy = -16; // Super Jump!
            }
          }
        }
      });

      // Update Skor berdasarkan ketinggian puncak
      let currentHeight = Math.floor(-player.y + 450);
      if (currentHeight > score) {
        score = currentHeight;
      }

      scoreEl.innerText = score;
    }

    function render() {
      // Clear Screen
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // Render Platforms
      platforms.forEach(plat => {
        if (plat.y - cameraY > -50 && plat.y - cameraY < canvas.height + 50) {
          drawPlatform(plat);
        }
      });

      // Render Items
      items.forEach(item => {
        if (item.y - cameraY > -50 && item.y - cameraY < canvas.height + 50) {
          drawItems(item);
        }
      });

      // Render Player
      drawPlayer();
    }

    function gameLoop() {
      update();
      render();
      if (!isGameOver) {
        requestAnimationFrame(gameLoop);
      }
    }

    function endGame() {
      isGameOver = true;
      finalScoreEl.innerText = score;
      gameOverScreen.classList.add('active');
    }

    function resetGame() {
      score = 0;
      cameraY = 0;
      scrollSpeed = 1.2;
      isGameOver = false;

      player.x = 200;
      player.y = 450;
      player.vx = 0;
      player.vy = player.jumpForce;

      gameOverScreen.classList.remove('active');
      initPlatforms();
      gameLoop();
    }

    // Start Game Pertama Kali
    initPlatforms();
    gameLoop();
  </script>
</body>
</html>
