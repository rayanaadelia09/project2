<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chrono-Drive: Time-Rewind Rogue</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #090a0f;
      color: #fff;
      font-family: 'Segoe UI', Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
    }
    #game-container {
      position: relative;
      border: 2px solid #00f3ff;
      border-radius: 12px;
      box-shadow: 0 0 30px rgba(0, 243, 255, 0.3);
      overflow: hidden;
    }
    canvas { display: block; background: #050508; }
    #ui {
      position: absolute;
      top: 15px;
      left: 15px;
      right: 15px;
      display: flex;
      justify-content: space-between;
      font-size: 18px;
      font-weight: bold;
      pointer-events: none;
      text-shadow: 0 0 8px rgba(0,0,0,0.8);
    }
    .energy-bar-bg {
      width: 150px;
      height: 16px;
      background: rgba(255, 255, 255, 0.2);
      border-radius: 8px;
      overflow: hidden;
      border: 1px solid #ff0055;
    }
    #energy-bar {
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, #ff0055, #ffaa00);
      transition: width 0.1s linear;
    }
    #overlay {
      position: absolute;
      inset: 0;
      background: rgba(5, 5, 8, 0.85);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      opacity: 1;
      transition: opacity 0.3s;
    }
    #overlay.hidden { opacity: 0; pointer-events: none; }
    h1 {
      font-size: 32px;
      color: #00f3ff;
      text-shadow: 0 0 15px #00f3ff;
      margin-bottom: 10px;
      text-align: center;
    }
    p { margin-bottom: 20px; font-size: 15px; color: #ccc; text-align: center; max-width: 80%; }
    button {
      padding: 12px 30px;
      font-size: 18px;
      font-weight: bold;
      color: #050508;
      background: #00f3ff;
      border: none;
      border-radius: 25px;
      cursor: pointer;
      box-shadow: 0 0 15px #00f3ff;
      transition: 0.2s;
    }
    button:hover { transform: scale(1.05); background: #fff; }
    .rewind-indicator {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 36px;
      color: #ff0055;
      font-weight: 900;
      letter-spacing: 4px;
      text-shadow: 0 0 20px #ff0055;
      display: none;
      pointer-events: none;
    }
  </style>
</head>
<body>

  <div id="game-container">
    <canvas id="canvas" width="450" height="600"></canvas>
    
    <div id="ui">
      <div>SCORE: <span id="score">0</span></div>
      <div>
        REWIND ENERGY
        <div class="energy-bar-bg"><div id="energy-bar"></div></div>
      </div>
    </div>

    <div id="rewind-text" class="rewind-indicator">◀◀ REWINDING</div>

    <div id="overlay">
      <h1 id="title">CHRONO-DRIVE</h1>
      <p id="desc">Gunakan <b>A/D</b> atau <b>Panah Kiri/Kanan</b> untuk menghindar.<br>Tahan <b>SPASI</b> untuk <b>MEMUTAR BALIK WAKTU</b> saat dalam bahaya!</p>
      <button id="start-btn" onclick="startGame()">MULAI MAIN</button>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const scoreEl = document.getElementById('score');
    const energyBar = document.getElementById('energy-bar');
    const overlay = document.getElementById('overlay');
    const rewindText = document.getElementById('rewind-text');

    // Simple Web Audio API Synthesizer
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function playSynth(freq, type = 'sine', duration = 0.1) {
      if (audioCtx.state === 'suspended') audioCtx.resume();
      try {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + duration);
      } catch(e){}
    }

    // State Variables
    let isRunning = false;
    let isRewinding = false;
    let score = 0;
    let rewindEnergy = 100;
    let history = []; // Rekaman waktu (Time-rewind buffer)

    const player = { x: 225, y: 500, r: 14, speed: 6, vx: 0 };
    let obstacles = [];
    let crystals = [];
    let frame = 0;
    const keys = { left: false, right: false, space: false };

    // Inputs
    window.addEventListener('keydown', e => {
      if (e.key === 'ArrowLeft' || e.key.toLowerCase() === 'a') keys.left = true;
      if (e.key === 'ArrowRight' || e.key.toLowerCase() === 'd') keys.right = true;
      if (e.code === 'Space') keys.space = true;
    });

    window.addEventListener('keyup', e => {
      if (e.key === 'ArrowLeft' || e.key.toLowerCase() === 'a') keys.left = false;
      if (e.key === 'ArrowRight' || e.key.toLowerCase() === 'd') keys.right = false;
      if (e.code === 'Space') keys.space = false;
    });

    function spawnElements() {
      if (frame % 40 === 0) {
        // Spawn Obstacle
        obstacles.push({
          x: Math.random() * (canvas.width - 60) + 30,
          y: -30,
          w: Math.random() * 40 + 30,
          h: 20,
          speed: Math.random() * 2 + 4
        });
      }
      if (frame % 70 === 0) {
        // Spawn Energy Crystal
        crystals.push({
          x: Math.random() * (canvas.width - 40) + 20,
          y: -20,
          r: 8,
          speed: 3
        });
      }
    }

    function recordState() {
      // Simpan kondisi game setiap frame (Maksimal 180 frame = 3 detik)
      history.push({
        player: { ...player },
        obstacles: JSON.parse(JSON.stringify(obstacles)),
        crystals: JSON.parse(JSON.stringify(crystals)),
        score: score,
        frame: frame
      });
      if (history.length > 180) history.shift();
    }

    function rewindState() {
      if (history.length > 0 && rewindEnergy > 0) {
        const prev = history.pop();
        player.x = prev.player.x;
        player.y = prev.player.y;
        obstacles = prev.obstacles;
        crystals = prev.crystals;
        score = prev.score;
        frame = prev.frame;
        
        rewindEnergy -= 0.8;
        if (rewindEnergy < 0) rewindEnergy = 0;
        playSynth(150 + Math.random() * 100, 'sawtooth', 0.05);
      } else {
        isRewinding = false;
      }
    }

    function update() {
      if (!isRunning) return;

      // Cek fitur Time Rewind
      if (keys.space && rewindEnergy > 5 && history.length > 10) {
        isRewinding = true;
        rewindText.style.display = 'block';
        rewindState();
        energyBar.style.width = rewindEnergy + '%';
        scoreEl.innerText = Math.floor(score);
        return;
      } else {
        isRewinding = false;
        rewindText.style.display = 'none';
        // Isi ulang energi perlahan
        if (rewindEnergy < 100) rewindEnergy += 0.05;
        energyBar.style.width = rewindEnergy + '%';
      }

      recordState();
      frame++;
      score += 0.1;
      scoreEl.innerText = Math.floor(score);

      // Gerakan Player
      if (keys.left) player.vx = -player.speed;
      else if (keys.right) player.vx = player.speed;
      else player.vx *= 0.8;

      player.x += player.vx;
      if (player.x < player.r) player.x = player.r;
      if (player.x > canvas.width - player.r) player.x = canvas.width - player.r;

      spawnElements();

      // Update Obstacles
      for (let i = obstacles.length - 1; i >= 0; i--) {
        let o = obstacles[i];
        o.y += o.speed;

        // Collision Check dengan Player
        if (
          player.x + player.r > o.x - o.w/2 &&
          player.x - player.r < o.x + o.w/2 &&
          player.y + player.r > o.y - o.h/2 &&
          player.y - player.r < o.y + o.h/2
        ) {
          playSynth(100, 'square', 0.3);
          gameOver();
          return;
        }

        if (o.y > canvas.height + 50) obstacles.splice(i, 1);
      }

      // Update Crystals
      for (let i = crystals.length - 1; i >= 0; i--) {
        let c = crystals[i];
        c.y += c.speed;

        let dist = Math.hypot(player.x - c.x, player.y - c.y);
        if (dist < player.r + c.r) {
          playSynth(600, 'sine', 0.1);
          rewindEnergy = Math.min(100, rewindEnergy + 20);
          score += 25;
          crystals.splice(i, 1);
        } else if (c.y > canvas.height + 30) {
          crystals.splice(i, 1);
        }
      }
    }

    function render() {
      // Clear Screen
      ctx.fillStyle = isRewinding ? '#150008' : '#050508';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Draw Grid Lines (Speed Effect)
      ctx.strokeStyle = isRewinding ? 'rgba(255,0,85,0.15)' : 'rgba(0, 243, 255, 0.1)';
      ctx.lineWidth = 1;
      for (let x = 0; x < canvas.width; x += 30) {
        ctx.beginPath();
        ctx.moveTo(x, 0);
        ctx.lineTo(x, canvas.height);
        ctx.stroke();
      }

      // Draw Obstacles
      obstacles.forEach(o => {
        ctx.fillStyle = '#ff0055';
        ctx.shadowColor = '#ff0055';
        ctx.shadowBlur = 10;
        ctx.fillRect(o.x - o.w/2, o.y - o.h/2, o.w, o.h);
      });

      // Draw Crystals
      crystals.forEach(c => {
        ctx.fillStyle = '#ffaa00';
        ctx.shadowColor = '#ffaa00';
        ctx.shadowBlur = 12;
        ctx.beginPath();
        ctx.arc(c.x, c.y, c.r, 0, Math.PI * 2);
        ctx.fill();
      });

      // Draw Player
      ctx.fillStyle = isRewinding ? '#ff0055' : '#00f3ff';
      ctx.shadowColor = ctx.fillStyle;
      ctx.shadowBlur = 15;
      ctx.beginPath();
      ctx.arc(player.x, player.y, player.r, 0, Math.PI * 2);
      ctx.fill();

      // Reset Shadow
      ctx.shadowBlur = 0;
    }

    function gameLoop() {
      update();
      render();
      if (isRunning) requestAnimationFrame(gameLoop);
    }

    function startGame() {
      score = 0;
      rewindEnergy = 100;
      history = [];
      obstacles = [];
      crystals = [];
      player.x = 225;
      player.vx = 0;
      isRunning = true;
      overlay.classList.add('hidden');
      gameLoop();
    }

    function gameOver() {
      isRunning = false;
      document.getElementById('title').innerText = "GAME OVER!";
      document.getElementById('desc').innerHTML = `Skor Akhir: <b>${Math.floor(score)}</b><br>Gunakan keahlian rewind lebih cepat!`;
      document.getElementById('start-btn').innerText = "COBA LAGI";
      overlay.classList.remove('hidden');
    }
  </script>
</body>
</html>
